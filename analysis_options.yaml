include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - '**/*.g.dart'
    - '**/*.freezed.dart'
    - lib/l10n/generated/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true

linter:
  rules:
    # Public contracts should be explicit; local inference remains useful.
    always_declare_return_types: true
    type_annotate_public_apis: true
    avoid_dynamic_calls: true

    # Names and imports should be easy to navigate.
    file_names: true
    directives_ordering: true

    # Catch dropped asynchronous work and avoid debug output in releases.
    unawaited_futures: true
    discarded_futures: true
    avoid_print: true
